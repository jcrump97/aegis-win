[package]
name = "aegis-launcher"
version = "1.0.0"
description = "One-click setup and launch for AegisWin (builds `Start AegisWin.exe`)"
authors = ["AegisWin Contributors"]
edition = "2021"
publish = false

# Standard library only at runtime: the launcher has to work on a machine that has nothing installed yet.
[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
