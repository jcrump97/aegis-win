[package]
name = "aegis-plugin-event-logs"
description = "AegisWin plugin: Windows event log queries and LLM analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aegis-core.workspace = true
async-trait = "0.1"
serde_json.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
aegis-core = { workspace = true, features = ["test-util"] }
# The checks suggest windows-health tools; the registry test needs both plugins.
aegis-plugin-windows-health = { path = "../windows-health" }
tempfile = "3"
